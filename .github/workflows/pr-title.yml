name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  title:
    name: Conventional commit title
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
