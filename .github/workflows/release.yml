name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    name: Version
    needs: ci
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - id: next
        name: Next version
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          next=$(git-cliff --offline --unreleased --bumped-version)
          echo "latest=${latest:-none} next=$next"

          if [ "$next" != "$latest" ]; then
            echo "tag=$next" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: version
    if: needs.version.outputs.tag != ''
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          cache: false
      - run: echo "BUILD_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - run: cargo build-release --locked --target "$TARGET"
      - name: Check version
        run: |
          actual=$("target/$TARGET/release/release-test" --version)
          echo "expected=$BUILD_VERSION actual=$actual"
          test "$actual" = "$BUILD_VERSION"
      - name: Package
        run: |
          name="release-test-$TAG-$TARGET"
          tar -czf "$name.tar.gz" -C "target/$TARGET/release" release-test
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: release-test-*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git-cliff --unreleased --tag "$TAG" --github-repo "$GITHUB_REPOSITORY" --output notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md dist/*
