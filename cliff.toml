[changelog]
body = """
{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking -%}
### ⚠ Breaking changes
{% for commit in breaking -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/hampustagerud/rust-release-experiments/commit/{{ commit.id }}))
{% endfor %}
{% endif -%}
{% for group, group_commits in commits | filter(attribute="breaking", value=false) | group_by(attribute="group") -%}
### {{ group | striptags | trim }}
{% for commit in group_commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/hampustagerud/rust-release-experiments/commit/{{ commit.id }}))
{% endfor %}
{% endfor -%}
{% if previous.version -%}
**Full changelog:** https://github.com/hampustagerud/rust-release-experiments/compare/{{ previous.version }}...{{ version }}
{% endif -%}
"""
trim = true

[git]
conventional_commits = true
require_conventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
commit_parsers = [
	{ message = "^feat", group = "<!-- 0 -->Features" },
	{ message = "^fix", group = "<!-- 1 -->Bug fixes" },
	{ message = "^perf", group = "<!-- 2 -->Performance" },
	{ message = "^revert", group = "<!-- 3 -->Reverts" },
	{ message = "^(chore|docs|refactor|style|test|ci|build)", skip = true },
]

[bump]
initial_tag = "v1.0.0"
